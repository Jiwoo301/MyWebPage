<section class="choir-gallery" aria-label="합창단 사진" aria-roledescription="사진 슬라이드" tabindex="0">
    <div class="choir-gallery-photos">
        {{- range $index, $path := slice "images/choir-group.jpg" "images/choir-group-2.jpg" }}
        {{- $photo := resources.Get $path }}
        <img src="{{ $photo.RelPermalink }}" alt="합창단 사진 {{ add $index 1 }}" width="{{ $photo.Width }}" height="{{ $photo.Height }}" loading="lazy"{{ if $index }} hidden{{ end }}>
        {{- end }}
    </div>
    <div class="choir-gallery-controls" hidden>
        <button type="button" data-direction="-1" aria-label="이전 사진">&#10094;</button>
        <span aria-live="polite" aria-atomic="true">1 / 2</span>
        <button type="button" data-direction="1" aria-label="다음 사진">&#10095;</button>
    </div>
</section>
{{- $script := resources.Get "js/choir-gallery.js" | minify | fingerprint }}
<script src="{{ $script.RelPermalink }}" defer></script>
